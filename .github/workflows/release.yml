name: Release

# 推送 v* 标签时：构建 Windows 双 exe + 安卓 APK，汇总发布 GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Vet & Test (race)
        shell: pwsh
        run: |
          go vet ./...
          go test -race -count=1 ./core -run TestSafeName
          go test -race -count=1 ./core -run TestQR
          go test -race -count=1 ./core -run TestUnique

      - name: Build filedrop.exe / filedrop-tray.exe
        shell: pwsh
        run: |
          go build -trimpath -ldflags "-s -w" -o filedrop.exe .
          go build -trimpath -ldflags "-s -w" -o filedrop-tray.exe ./tray

      - name: Smoke test (headless server)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\filedrop.exe -ArgumentList '-port','28999','-no-auth' -PassThru
          Start-Sleep 2
          $info = Invoke-RestMethod -Uri 'http://127.0.0.1:28999/api/info'
          Write-Host "version=$($info.version)"
          if ($info.version -notmatch '^\d+\.\d+\.\d+$') { throw 'bad version' }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            filedrop.exe
            filedrop-tray.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install gomobile & gobind (pinned)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@d5bb5ecc55c03634c30adcf688f9a2482006dcb0
          go install golang.org/x/mobile/cmd/gobind@d5bb5ecc55c03634c30adcf688f9a2482006dcb0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27b
          add-to-path: false

      - name: Extract version from core
        id: ver
        run: |
          VERSION=$(grep -oE 'Version = "[0-9]+\.[0-9]+\.[0-9]+"' core/server.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          VCODE=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "core version=$VERSION, versionCode=$VCODE"

      - name: gomobile init & bind (arm64 only)
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="${{ steps.ndk.outputs.ndk-path }}"
          gomobile init
          mkdir -p android/app/libs
          BIND_OK=0
          # 瘦身：pinned gomobile 没有 -abi flag，架构要写进 target（-target=android/arm64）
          if gomobile bind -target=android/arm64 -androidapi 26 \
              -o android/app/libs/filedrop.aar ./mobile 2>&1 | tee bind.log; then
            BIND_OK=1
          else
            echo "::warning::arm64-only bind 失败，回退全 ABI 构建"
            # 即使回退成功也把主选失败日志推到 ci-logs，供诊断瘦身问题
            git config user.name "ci-bot" && git config user.email "ci-bot@users.noreply.github.com"
            git checkout -B ci-logs
            git add -f bind.log
            git commit -m "arm64 bind log for ${GITHUB_SHA}" || true
            git push -f origin ci-logs || true
            if gomobile bind -target=android -androidapi 26 \
                -o android/app/libs/filedrop.aar ./mobile 2>&1 | tee bind-fallback.log; then
              BIND_OK=1
            else
              grep -aE "error|ERROR|fail|FAIL|cannot|undefined|unsupported" bind-fallback.log | tail -15 | while IFS= read -r l; do
                echo "::error::${l:0:400}"
              done
            fi
          fi
          if [ "$BIND_OK" != "1" ]; then
            git checkout -B ci-logs
            git add -f bind.log bind-fallback.log 2>/dev/null || true
            git commit -m "bind logs for ${GITHUB_SHA}" || true
            git push -f origin ci-logs || true
            exit 1
          fi
          ls -la android/app/libs/

      - name: Build APK (signed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gradle assembleRelease
        run: |
          cd android
          set -o pipefail
          if ! gradle \
              -PversionName=${{ steps.ver.outputs.version }} \
              -PversionCode=${{ steps.ver.outputs.vcode }} \
              assembleRelease --no-daemon 2>&1 | tee gradle.log; then
            # ::error:: 会变成 check-run annotation，匿名 API 可读（step summary 匿名读不到）
            grep -aE "^e: |error:|What went wrong|Execution failed|FAILURE: Build" gradle.log | tail -15 | while IFS= read -r l; do
              echo "::error::${l:0:400}"
            done
            # 完整日志推到 ci-logs 分支，匿名可读 raw 文件
            git config user.name "ci-bot" && git config user.email "ci-bot@users.noreply.github.com"
            git checkout -B ci-logs
            git add -f gradle.log
            git commit -m "gradle log for ${GITHUB_SHA}"
            git push -f origin ci-logs
            exit 1
          fi

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk filedrop-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: filedrop-android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/filedrop.exe
            artifacts/windows/filedrop-tray.exe
            artifacts/android/filedrop-android.apk
          body: |
            **FileDrop ${{ github.ref_name }} —— 局域网文件快传**

            - **Windows**：下载 `filedrop-tray.exe`（托盘版，推荐）或 `filedrop.exe`（无界面版），
              双击运行，手机/平板浏览器扫页面上的二维码即可互传。
            - **Android**：下载 `filedrop-android.apk` 安装（设置里允许安装未知来源应用）。
              打开 App 即成为主机，电脑/其他设备扫 App 页面上的二维码连进来。

            互传组合：手机 ↔ 电脑、手机 ↔ 平板、平板 ↔ 电脑 —— 谁开服务谁是主机，其余设备扫码加入。

            首次运行 Windows 版会被 SmartScreen 提示（未做代码签名），选择「仍要运行」即可。
